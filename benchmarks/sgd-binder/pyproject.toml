[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgd-binder"
version = "0.0.0"
description = "Infona binder-bench on Schema-Guided Dialogue (constructed, not official DST)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sgd-binder = "sgd_binder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
