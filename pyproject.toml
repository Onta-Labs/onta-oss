[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name is the public brand (PyPI short names may be taken —
# hence -client). Canonical import path is `infona_client`.
[project]
name = "infona-client"
version = "0.1.29"
description = "Infona living context graph (OSS core)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "rapidfuzz>=3.10.0",
    "anthropic>=0.85.0",
    "boto3>=1.35.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "numpy>=1.26.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.4.0",
    "cryptography>=43.0.0",
    # Official Neo4j Python driver (async). Neo4j is the default production
    # graph backend (GraphStore). OSS is BYOK: set NEO4J_URI / NEO4J_USER /
    # NEO4J_PASSWORD yourself (see docker-compose.yml for local).
    "neo4j>=5.26.0",
    # SPARQL 1.1 grammar for the tenant-confinement guard on the raw-SPARQL
    # route (ONTA-412, graph/sparql_scope.py). Pure Python, and used ONLY to
    # parse caller-supplied query text, never to store or reason over RDF.
    # A parser is not a luxury here: deciding "does this query declare a
    # dataset" by scanning for the FROM keyword is exploitable, because
    # PN_LOCAL / BLANK_NODE_LABEL let a name like `_:b-FROM` contain the
    # keyword, so the guard sees a clause the store does not.
    # sparql_scope imports it LAZILY and 503s the route if it is missing, so a
    # deployment without it boots and stays safe rather than crashing or
    # silently skipping the check. Must ALSO be added to the PARENT repo's
    # pyproject.toml: the deployed image runs `pip install .` against THAT dep
    # list (same reason asyncpg / pgvector / cryptography are dual-listed), so
    # without it the raw-SPARQL route 503s in production.
    "rdflib>=7.0.0",
]

[project.urls]
Homepage = "https://infona.ai"
Documentation = "https://github.com/infona-ai/infona-oss/blob/main/docs/BOUNDARY.md"
Repository = "https://github.com/infona-ai/infona-oss"
Issues = "https://github.com/infona-ai/infona-oss/issues"

[project.optional-dependencies]
# Alias kept so `pip install -e ".[neo4j]"` / older docs still work; neo4j is
# already a core dependency above.
neo4j = [
    "neo4j>=5.26.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx",
    "neo4j>=5.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["infona_client"]

[tool.hatch.build.targets.sdist]
include = [
    "/infona_client",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests requiring a live server + LLM API key (not run in CI)",
    "neo4j: tests that need a live Neo4j (NEO4J_URI + NEO4J_PASSWORD); skipped by default",
]
