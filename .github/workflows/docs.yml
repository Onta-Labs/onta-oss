name: Generate API Docs

on:
  push:
    branches: [main]
    paths:
      - 'infona_client/api/**'
      - 'infona_client/models/**'
      - 'scripts/generate_api_docs.py'
      - 'docs/openapi.json'
      - 'docs/API.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'infona_client/api/**'
      - 'infona_client/models/**'
      - 'scripts/generate_api_docs.py'
      - 'docs/openapi.json'
      - 'docs/API.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Generate API docs
        run: |
          source .venv/bin/activate
          python scripts/generate_api_docs.py
        env:
          INFONA_NEPTUNE_ENDPOINT: "http://fake:8182"

      # PRs must fail on drift — do not only auto-commit on main.
      - name: Fail if generated docs drifted
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- docs/openapi.json docs/API.md

      - name: Commit docs if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json docs/API.md
          git diff --cached --quiet || git commit -m "docs: auto-generate API reference"
          git push
