# ONTA-287 — README 10-minute quickstart guard.
# Mocked / zero-key on every PR (no key, no spend). Live-key ingest+ask only
# on push-to-main and workflow_dispatch — never fork PRs, never PR secrets.
# Job if: cannot read `secrets`. Empty OPENROUTER_API_KEY skips live steps
# (exit 0), never fails the job.
#
# Every-PR job is NOT a literal `./scripts/oss_up.sh` (compose --build is a
# cold-image tax). It uses the neo4j.yml service + host uvicorn +
# load_prebuilt_trials.sh. The live job on main *is* literal oss_up.sh.
name: OSS quickstart smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-quickstart-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mocked:
    name: Mocked / zero-key (every PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/infona-dev-password
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p infona-dev-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: infona-dev-password
      INFONA_GRAPH_BACKEND: neo4j
      INFONA_API_URL: http://127.0.0.1:8000
      INFONA_TENANT: default
      PYTHONPATH: ${{ github.workspace }}
      SMOKE_MODE: mocked
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build CLI (no npm cache)
        run: |
          npm ci
          npm run build --workspace packages/cli

      - name: Start API against the Neo4j service
        run: |
          source .venv/bin/activate
          unset OPENROUTER_API_KEY INFONA_OPENROUTER_API_KEY \
            CEREBRAS_API_KEY INFONA_CEREBRAS_API_KEY \
            INFONA_ANTHROPIC_API_KEY ANTHROPIC_API_KEY \
            INFONA_LLM_BASE_URL INFONA_QUERY_BASE_URL \
            INFONA_ASK_CACHED_PLAN
          nohup uvicorn infona_client.api.app:create_app --factory \
            --host 127.0.0.1 --port 8000 \
            > /tmp/infona-api.log 2>&1 &
          echo $! > /tmp/infona-api.pid

      - name: Quickstart smoke (zero-key ask → FLAURA2)
        run: |
          source .venv/bin/activate
          unset OPENROUTER_API_KEY INFONA_OPENROUTER_API_KEY \
            CEREBRAS_API_KEY INFONA_CEREBRAS_API_KEY \
            INFONA_ANTHROPIC_API_KEY ANTHROPIC_API_KEY \
            INFONA_LLM_BASE_URL INFONA_QUERY_BASE_URL
          bash scripts/ci_quickstart_smoke.sh

      - name: Dump API logs on failure
        if: failure()
        run: cat /tmp/infona-api.log || true

      - name: Hermetic FLAURA2 + suppliers ER + workflow contract
        run: |
          source .venv/bin/activate
          pytest -m "not integration" -q --tb=short \
            tests/test_zero_key_ask.py \
            tests/test_suppliers_messy_fixture.py \
            tests/test_quickstart_smoke_workflow.py \
            tests/test_file_size_budget.py
        env:
          INFONA_API_KEYS: '{"test-key": "test-tenant"}'
          INFONA_NEPTUNE_ENDPOINT: "http://fake-neptune:8182"
          PYTHONPATH: ${{ github.workspace }}

  live:
    name: Live-key (main / dispatch)
    if: github.repository == 'infona-ai/infona-oss' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      INFONA_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      INFONA_QUERY_PROVIDER: openrouter
      # Pinned for a deterministic live assertion. Temperature is 0 on the
      # product Cypher path (pipeline_cypher_gen.py). Flash stays inside the
      # 60s CLI /ask timeout; gpt-oss-120b often does not.
      INFONA_QUERY_MODEL: google/gemini-2.5-flash
      INFONA_CSV_SCHEMA_MODEL: google/gemini-2.5-flash
      INFONA_API_URL: http://127.0.0.1:8000
      INFONA_TENANT: default
      INFONA_OSS_UP_TIMEOUT: "180"
      SMOKE_MODE: live
    steps:
      - uses: actions/checkout@v4

      - name: Skip live ingest (no OPENROUTER_API_KEY)
        if: env.OPENROUTER_API_KEY == ''
        run: echo "OPENROUTER_API_KEY is empty; live ingest+ask skipped (not a failure)."

      - name: Set up Node
        if: env.OPENROUTER_API_KEY != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Write .env (pinned model; live key)
        if: env.OPENROUTER_API_KEY != ''
        run: |
          {
            echo "INFONA_GRAPH_BACKEND=neo4j"
            echo "NEO4J_URI=bolt://localhost:7687"
            echo "NEO4J_USER=neo4j"
            echo "NEO4J_PASSWORD=infona-dev-password"
            echo "INFONA_QUERY_PROVIDER=openrouter"
            echo "INFONA_QUERY_MODEL=google/gemini-2.5-flash"
            echo "INFONA_CSV_SCHEMA_MODEL=google/gemini-2.5-flash"
            printf 'OPENROUTER_API_KEY=%s\n' "${OPENROUTER_API_KEY}"
            printf 'INFONA_OPENROUTER_API_KEY=%s\n' "${OPENROUTER_API_KEY}"
          } > .env

      - name: oss_up.sh (literal compose --build, fresh runner)
        if: env.OPENROUTER_API_KEY != ''
        run: ./scripts/oss_up.sh

      - name: Live ingest + pinned ask → FLAURA2
        if: env.OPENROUTER_API_KEY != ''
        run: bash scripts/ci_quickstart_smoke.sh

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail 80 || true
