# Neo4j GraphStore CI — hermetic golden / isolation / graph_store suites, plus
# optional live Neo4j service when the driver + container are healthy.
#
# Product tip is Neo4j-only (ADR 0012/0013). Runs on **main** (default branch)
# and the historical **neo4j** branch until the latter is retired. Companion
# workflow test.yml still runs the full hermetic pytest matrix on main.
name: Neo4j GraphStore

on:
  push:
    branches: [main, neo4j]
  pull_request:
    branches: [main, neo4j]
  workflow_dispatch:

jobs:
  hermetic:
    name: Hermetic golden + isolation + graph_store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          # dev extra includes neo4j driver (for import); live tests still
          # need NEO4J_URI + a reachable service.
          uv pip install -e ".[dev]"

      - name: Run hermetic Neo4j GraphStore suite
        run: |
          source .venv/bin/activate
          pytest -q --tb=short \
            tests/test_graph_store.py \
            tests/test_explore_store.py \
            tests/test_kg_writer_store.py \
            tests/test_rails_graph_store_write.py \
            tests/test_rdf_semantic_model.py \
            tests/test_golden_rdf_semantics.py \
            tests/test_neo4j_isolation_suite.py \
            tests/test_cypher_scope.py \
            tests/test_cypher_prompts.py \
            tests/test_ask_cypher_pipeline.py \
            tests/test_query_neo4j_hard_break.py \
            tests/test_rdfs_helpers.py
        env:
          # Explicit: hermetic suite must not flip the default backend.
          INFONA_GRAPH_BACKEND: neptune
          INFONA_API_KEYS: '{"test-key": "test-tenant"}'
          INFONA_NEPTUNE_ENDPOINT: "http://fake-neptune:8182"
          PYTHONPATH: ${{ github.workspace }}

  live-neo4j:
    name: Live Neo4j smoke (optional service)
    runs-on: ubuntu-latest
    # Always schedule the job; tests skip closed if the service never becomes
    # healthy. On workflow_dispatch / neo4j branch we still want the signal.
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/infona-dev-password
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p infona-dev-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev,neo4j]"

      - name: Run pytest -m neo4j
        run: |
          source .venv/bin/activate
          pytest -m neo4j -v --tb=short
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: infona-dev-password
          # Live path: production default is Neo4j (ADR 0012/0013).
          INFONA_GRAPH_BACKEND: neo4j
          INFONA_API_KEYS: '{"test-key": "test-tenant"}'
          INFONA_NEPTUNE_ENDPOINT: "http://fake-neptune:8182"
          PYTHONPATH: ${{ github.workspace }}
