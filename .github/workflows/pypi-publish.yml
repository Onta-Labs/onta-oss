name: Publish

# One version, three packages: @infona-ai/cli, @infona-ai/mcp, infona-client.
# PyPI auth is repo secret PYPI_API_TOKEN. Re-runs are idempotent: already
# published npm versions are skipped; PyPI skip-existing is on. After a
# successful bump + npm + PyPI publish, tags v${VERSION} and opens a
# GitHub Release (skip if the tag exists). Do not backfill 0.1.17–0.1.42.

on:
  push:
    branches: [main, neo4j]
    paths:
      - "packages/cli/**"
      - "packages/mcp/**"
      - "infona_client/**"
      - "pyproject.toml"
      - "scripts/sync_release_version.py"
      - "scripts/check_pypi_bundle.sh"
      - "scripts/check_npm_bundle.sh"
      - ".github/workflows/pypi-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide bump vs republish
        id: skip
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          if echo "$SUBJECT" | grep -q "^chore(release):"; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "bump=false" >> "$GITHUB_OUTPUT"
              echo "HEAD is a release commit — republish current versions."
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "bump=false" >> "$GITHUB_OUTPUT"
              echo "Release bump commit on push — not looping."
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@infona-ai"

      - uses: astral-sh/setup-uv@v4
        if: steps.skip.outputs.skip != 'true'

      - name: Install JS deps and build
        if: steps.skip.outputs.skip != 'true'
        run: |
          npm ci
          npm run build --workspaces

      - name: Inspect npm tarballs
        if: steps.skip.outputs.skip != 'true'
        run: bash scripts/check_npm_bundle.sh

      - name: Bump one shared version
        if: steps.skip.outputs.skip != 'true' && steps.skip.outputs.bump == 'true'
        id: ver
        run: |
          NEW_VERSION=$(python3 scripts/sync_release_version.py --bump patch)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json pyproject.toml packages/cli/package.json packages/mcp/package.json package-lock.json
          git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
          git push

      - name: Refuse in-repo version drift
        if: steps.skip.outputs.skip != 'true'
        run: python3 scripts/sync_release_version.py

      - name: Build and inspect PyPI artifacts
        if: steps.skip.outputs.skip != 'true'
        run: |
          uv build
          bash scripts/check_pypi_bundle.sh

      - name: Publish @infona-ai/cli
        if: steps.skip.outputs.skip != 'true'
        working-directory: packages/cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "${NAME}@${VER} already on npm — skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @infona-ai/mcp
        if: steps.skip.outputs.skip != 'true'
        working-directory: packages/mcp
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "${NAME}@${VER} already on npm — skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish infona-client to PyPI
        if: steps.skip.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Tag and GitHub Release
        if: steps.skip.outputs.skip != 'true' && steps.skip.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v${VERSION}"
          if [ -z "$VERSION" ]; then
            echo "no bumped version — skipping tag"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists — skipping"
            exit 0
          fi
          gh release create "${TAG}" \
            --target "$(git rev-parse HEAD)" \
            --title "${TAG}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
