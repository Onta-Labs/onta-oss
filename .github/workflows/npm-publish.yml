name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/mcp/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push version-bump commit
      id-token: write   # needed for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          # Scoped packages under the infona-ai org. NODE_AUTH_TOKEN (below)
          # must be an automation token for a user with publish rights on that org.
          scope: "@infona-ai"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build --workspaces

      # MOE-21 Layer 4 — inspect the actual tarballs for forbidden paths before
      # any publish. Public publication is a one-way door; this is the last gate.
      - name: Inspect bundles for OSS boundary violations
        run: bash scripts/check_npm_bundle.sh

      - name: Configure git for version bump commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Publish @infona-ai/cli (the SDK + CLI) first — @infona-ai/mcp depends on it.
      - name: Bump and publish @infona-ai/cli
        working-directory: packages/cli
        run: |
          # Skip if this commit was itself a version bump (avoids infinite loop)
          if git log -1 --pretty=%s | grep -q "^chore(release): bump @infona-ai/cli"; then
            echo "Version bump commit detected — skipping @infona-ai/cli publish."
            exit 0
          fi
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          cd ../..
          git add packages/cli/package.json package-lock.json
          git commit -m "chore(release): bump @infona-ai/cli to v${NEW_VERSION} [skip ci]"
          git push
          cd packages/cli
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish @infona-ai/mcp second — it depends on @infona-ai/cli via a `^0.1.0` range,
      # so it picks up whatever @infona-ai/cli version was just published above.
      - name: Bump and publish @infona-ai/mcp
        working-directory: packages/mcp
        run: |
          if git log -1 --pretty=%s | grep -q "^chore(release): bump @infona-ai/mcp"; then
            echo "Version bump commit detected — skipping @infona-ai/mcp publish."
            exit 0
          fi
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          cd ../..
          git add packages/mcp/package.json package-lock.json
          git commit -m "chore(release): bump @infona-ai/mcp to v${NEW_VERSION} [skip ci]"
          git push
          cd packages/mcp
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
