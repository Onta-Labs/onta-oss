name: Release lockstep

# Fail if latest @infona-ai/cli, @infona-ai/mcp, and infona-client disagree.
# In-repo lockstep is the hermetic pytest + Tests job. This job is the
# registry harness: it catches a partial publish after the fact.

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare latest npm and PyPI versions
        run: python3 scripts/sync_release_version.py --check-published
