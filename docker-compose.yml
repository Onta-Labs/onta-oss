# Local graph stores for Infona OSS.
#
# Default: Neo4j only (production path, ADR 0012/0013).
# Legacy SPARQL (Fuseki): docker compose --profile legacy-sparql up -d
#
#   NEO4J_URI=bolt://localhost:7687
#   NEO4J_USER=neo4j
#   NEO4J_PASSWORD=infona-dev-password

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/infona-dev-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Legacy SPARQL local store — not started by default.
  fuseki:
    profiles: ["legacy-sparql"]
    image: stain/jena-fuseki:latest
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
      - FUSEKI_DATASET_1=ds
    volumes:
      - fuseki-data:/fuseki/databases

volumes:
  neo4j-data:
  fuseki-data:
