# Local graph store + API for Infona OSS.
#
# Product path: Neo4j only (ADR 0012/0013, ONTA-527). graph_backend() rejects
# non-neo4j values — do not treat the Fuseki profile below as a usable product
# backend.
#
#   ./scripts/oss_up.sh            # one command: Neo4j + API + CLI config
#   docker compose up -d --build   # containers only
#
# API:  http://localhost:8000
# Bolt: bolt://localhost:7687  (NEO4J_USER=neo4j / NEO4J_PASSWORD=infona-dev-password)

services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/infona-dev-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: infona-dev-password
      INFONA_GRAPH_BACKEND: neo4j
      # Compose interpolates from host/.env; Settings also reads INFONA_* prefix.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      INFONA_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "infona_client.api.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    # HTTP 200 can still mean neo4j=false (degraded). Require a healthy store.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); raise SystemExit(0 if d.get('neo4j') and d.get('status')=='healthy' else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # QUARANTINE ONLY (not a supported product path).
  # Residual Fuseki image for migration/QC archaeology that still speaks SPARQL
  # against NeptuneClient. Product runtime will not select this backend.
  # Profile kept so residual scripts can still bring up a store if needed:
  #   docker compose --profile legacy-sparql up -d fuseki
  fuseki:
    profiles: ["legacy-sparql"]
    image: stain/jena-fuseki:latest
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
      - FUSEKI_DATASET_1=ds
    volumes:
      - fuseki-data:/fuseki/databases

volumes:
  neo4j-data:
  fuseki-data:
